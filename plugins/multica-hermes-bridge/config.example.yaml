version: 1

gateway:
  url: ws://127.0.0.1:9119/api/ws
  status_url: http://127.0.0.1:9119/api/status
  connect_timeout: 5s
  rpc_timeout: 30s
  turn_timeout: 2h
  allow_remote: false

session:
  source: multica
  # Optional Hermes profile. Empty means use Hermes' default profile.
  profile: ""
  cwd_policy: multica
  id_strategy: mapped
  replay_history: false

concurrency:
  # profile: different Profiles may turn concurrently; endpoint: serialize
  # every Profile sharing this Gateway endpoint.
  exclusive_turn_scope: profile

permissions:
  mode: multica

mcp:
  mode: hermes_native

logging:
  level: info
  log_prompts: false
  log_tool_outputs: false

supervisor:
  enabled: true
  # Supervisor is a separate long-lived process; ACP only connects over this
  # local endpoint. On Windows this value is normalized to a named pipe.
  endpoint: ~/.local/state/multica-hermes-gateway/supervisor.sock
  runtime_db: ~/.local/state/multica-hermes-gateway/runtime.db
  hermes_executable: hermes
  # shared reuses one Gateway endpoint; isolated owns one Gateway per Profile.
  scope: shared
  heartbeat_interval: 10s
  lease_ttl: 30s
  health_interval: 5s
  start_timeout: 20s
  shutdown_grace: 5s
  isolated_idle_timeout: 10m

# Optional local-only state path. Keep credentials out of this file when it is
# copied into Workbench; prefer MHG_GATEWAY_TOKEN_FILE for a local token.
# state_db: ~/.local/state/multica-hermes-gateway/state.db
