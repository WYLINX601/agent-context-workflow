$schema: "https://json-schema.org/draft/2020-12/schema"
title: Public task context manifest
type: object
additionalProperties: false
required: [schema_version, task_id, project_id, owner, status, objective, acceptance_criteria, context, access, created_at, expires_at, writeback]
properties:
  schema_version:
    const: 1
  task_id:
    type: string
    pattern: "^[A-Z][A-Z0-9_-]+$"
  project_id:
    type: [string, "null"]
  owner:
    type: string
    pattern: "^[a-z][a-z0-9-]+$"
  agent_id:
    type: [string, "null"]
    pattern: "^[a-z][a-z0-9-]+$"
  execution_target:
    type: [string, "null"]
    enum: [local, remote, null]
  ingress:
    type: [object, "null"]
    additionalProperties: false
    required: [platform, agent_id]
    properties:
      platform:
        type: string
        pattern: "^[a-z][a-z0-9-]+$"
      agent_id:
        type: string
        pattern: "^[a-z][a-z0-9-]+$"
      profile:
        type: [string, "null"]
        pattern: "^[a-z][a-z0-9-]+$"
      thread_id:
        type: [string, "null"]
  status:
    enum: [draft, ready, active, review, done, blocked, cancelled]
  objective:
    type: string
    minLength: 1
  acceptance_criteria:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  context:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, purpose]
      properties:
        path: {type: string, pattern: '^(?![A-Za-z]:|/|\\\\|.*\.\.).+'}
        purpose: {type: string, minLength: 1}
  access:
    type: object
    additionalProperties: false
    required: [read, write, deny]
    properties:
      read:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^(?![A-Za-z]:|/|\\\\|.*\.\.).+'}
      write:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^(?![A-Za-z]:|/|\\\\|.*\.\.).+'}
      deny:
        type: array
        minItems: 4
        uniqueItems: true
        items: {type: string, minLength: 1}
  created_at:
    type: string
    format: date-time
  expires_at:
    type: string
    format: date-time
  writeback:
    type: object
    additionalProperties: false
    required: [event_path, summary_required]
    properties:
      event_path: {type: string, pattern: '^events/[a-z][a-z0-9-]*/.+\.md$'}
      summary_required: {type: boolean}
  freshness_checked_at:
    type: [string, "null"]
    format: date-time
  blocked_by:
    type: array
    items: {type: string}
